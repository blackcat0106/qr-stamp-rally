<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRスタンプラリー</title>
  <link rel="preload" as="image" href="frame-input.webp">
  <link rel="preload" as="image" href="frame-done.webp">
  <style>
    :root {
      --honey: #F5A623;
      --honey-dark: #D8860B;
      --ink: #5A3E1B;
      --ink-soft: #8A6836;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 6px;
      background-color: #FFF3D6;
      background-image: radial-gradient(circle at 50% 0%, #FFFBEF 0%, #FFEFC7 70%);
      color: var(--ink);
    }
    .card {
      position: relative;
      width: min(98vw, 560px);
      /* フレーム画像(1024×683)本来の縦横比に固定する。
         これにより background-size:100% 100% で描いても絶対に歪まない
         （箱の比率と画像の比率が常に一致するため）。
         中身の量で高さを伸縮させない＝伸縮させるのは中身側（.card-window内で吸収）。 */
      aspect-ratio: 1024 / 683;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      /* 端末幅によっては背景画像の描画がごく僅かに枠の外へにじむことがあるため、
         確実に箱の内側でクリップする（見た目のはみ出し対策） */
      overflow: hidden;
    }
    .card.state-input {
      background-image: url("frame-input.webp");
    }
    .card.state-status,
    .card.state-complete {
      background-image: url("frame-done.webp");
    }
    /* フレーム画像の中で実際に白く空いている領域（＝飾りに一切かからない範囲）を
       画像から実測して割り出した「窓」。中身は必ずこの内側だけに配置する。
       frame-input.webp と frame-done.webp とで飾りの配置が違うため、窓の位置も別々に持つ。
       実測値からさらに内側へ安全マージンを足してある。
       この窓はコンテナクエリの基準にする（cqw/cqh）。中身のフォントサイズは
       ビューポート幅(vw)ではなく、この窓自体の実サイズを基準に伸縮させる。
       端末の文字拡大設定（OSの文字サイズ拡大）は px/vw/cqw を問わず一律で拡大されることがあり、
       clamp()の上限だけでは収めきれないケースが実機で確認されている。
       その場合は中身(.card-content)をJSで丸ごと等倍縮小(transform: scale)して収める
       （roblox-mobile-ui-fitと同じ考え方＝枠だけ縮めず中身ごと縮小、クリップやスクロールに逃げない）。
       overflow: hidden は縮小計算の1px未満の丸め誤差を吸収するための最終ガードのみ。 */
    .card-window {
      position: absolute;
      container-type: size;
      container-name: cardwin;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      padding: 2cqh 2cqw;
      overflow: hidden;
    }
    /* JSがtransform: scale()で丸ごと縮小する対象。
       widthを100%にして.card-window内での折り返し幅を固定し、
       縮小後も水平中央に来るようtransform-originを上端中央にする。 */
    .card-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform-origin: top center;
    }
    .card.state-input .card-window {
      inset: 26.4% 24.9% 21.8% 23.8%;
    }
    .card.state-status .card-window,
    .card.state-complete .card-window {
      inset: 19.5% 22.9% 20.8% 22.8%;
    }
    h1 {
      font-size: clamp(10px, 7cqw, 20px);
      margin: 0 0 0.15em;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }
    #status-message {
      font-size: clamp(9px, 5.5cqw, 15px);
      font-weight: bold;
      line-height: 1.3;
      margin: 0;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .hint {
      font-size: clamp(7px, 3.6cqw, 11px);
      color: var(--ink-soft);
      margin: 0.2em 0 0;
      line-height: 1.25;
    }
    .note {
      font-size: clamp(8px, 4.2cqw, 12px);
      font-weight: bold;
      color: #C0392B;
      margin: 0 0 0.25em;
      line-height: 1.25;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    input {
      padding: 0.3em;
      width: 100%;
      max-width: 280px;
      font-size: clamp(10px, 4.6cqw, 15px);
      text-align: center;
      border: 2px solid #E8C88A;
      border-radius: 10px;
      background: #FFFDF7;
      color: var(--ink);
      outline: none;
      flex-shrink: 0;
    }
    input:focus { border-color: var(--honey); }
    button {
      margin-top: 0.25em;
      padding: 0.3em 1em;
      cursor: pointer;
      font-family: inherit;
      font-size: clamp(9px, 4.2cqw, 14px);
      font-weight: bold;
      color: #fff;
      background-color: var(--honey);
      border: none;
      border-bottom: 3px solid var(--honey-dark);
      border-radius: 999px;
      flex-shrink: 0;
    }
    button:active { transform: translateY(2px); border-bottom-width: 1px; }
    button:disabled { background-color: #C9BFAC; border-bottom-color: #A99F8C; }
    .hidden { display: none !important; }
    .card.state-complete {
      animation: glow 1.8s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(245,166,35,0)); }
      50% { filter: drop-shadow(0 0 14px rgba(245,166,35,0.55)); }
    }
    .complete-badge {
      font-size: clamp(20px, 16cqw, 46px);
      line-height: 1;
      margin: 0 0 0.08em;
      animation: pop 0.55s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes pop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }
    #complete-section.repeat .complete-badge { animation: none; }
    #complete-title {
      font-size: clamp(12px, 8cqw, 20px);
      margin: 0 0 0.25em;
      color: var(--honey-dark);
    }
    .pickup-box {
      background: #FFFDF7;
      border: 2px solid #E8C88A;
      border-radius: 14px;
      padding: 0.45em 0.55em;
      max-width: 100%;
    }
    .pickup-label {
      font-size: clamp(9px, 4.8cqw, 13px);
      font-weight: bold;
      color: var(--honey-dark);
      margin: 0 0 0.25em;
    }
    .pickup-text {
      font-size: clamp(8.5px, 4.3cqw, 12.5px);
      line-height: 1.4;
      margin: 0;
      /* 最終行が「ょ！」のような1〜2文字だけ孤立しないよう、行の長さを均等化する */
      text-wrap: balance;
    }
    .pickup-text strong { color: #C0392B; }
  </style>
</head>
<body>
  <div class="card state-status" id="card">
    <div class="card-window">
    <div class="card-content">
    <div id="status-section">
      <h1>QRスタンプラリー</h1>
      <p id="status-message">データを読み込んでいます...</p>
    </div>

    <div id="id-input-section" class="hidden">
      <h1>Robloxユーザー名を入力</h1>
      <p id="form-note" class="note hidden"></p>
      <input type="text" id="roblox-username-input" placeholder="例: roblox_user123" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="save-button" onclick="saveUsername()">スタンプを記録する</button>
      <p class="hint">Robloxで使っている名前を入力してね</p>
    </div>

    <div id="complete-section" class="hidden">
      <div class="complete-badge" id="complete-badge">🎉</div>
      <h1 id="complete-title">コンプリート達成！</h1>
      <div class="pickup-box">
        <p class="pickup-label">🎁 受け取り場所</p>
        <p class="pickup-text">ゲーム内「<strong>ピトンの小屋</strong>」の<br>
        「UGC!!」の看板の前で受け取れるよ！</p>
      </div>
    </div>
    </div>
    </div>
  </div>

  <script>
    // ▼▼▼ 設定：GASウェブアプリのURL（/exec で終わるもの） ▼▼▼
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyJ5ou_wWGgmv1ReOhqMIPB2YFlNLaSRCjIS2QzTdRRmDUM6QXFQ4pOc6MIfZhyEv2I/exec";
    // ▲▲▲ 設定ここまで ▲▲▲

    // ローカルストレージに保存する際のキー
    const STORAGE_KEY = 'robloxUsername';
    // コンプリート演出を「もう見せた」印を付けておくキーの接頭辞（ユーザー名ごとに保存）
    const COMPLETE_FLAG_PREFIX = 'stampRallyCompleteShown:';

    // fetch1回あたりのタイムアウト（ミリ秒）。GASの応答は実測2〜4秒のため、
    // 15秒あれば正常な通信を誤って切ることはない。これが無いと、通信が返らない時に
    // 画面が「確認しています...」等で永久に固まってしまう。
    const FETCH_TIMEOUT_MS = 15000;
    // 同一ユーザーの連続登録制限に対する、自動リトライの待ち時間（秒）。
    // GAS側の RATE_LIMIT_SECONDS（2026-08-19に10秒→3秒へ緩和）に安全マージンを足した値。
    // ⚠GAS側の秒数を変えたら、ここも合わせて見直すこと。
    const RATE_LIMIT_RETRY_WAIT_SEC = 5;
    // 自動リトライの上限回数（無限リトライ防止）
    const RATE_LIMIT_MAX_RETRIES = 3;

    const card = document.getElementById('card');
    const cardWindow = document.querySelector('.card-window');
    const cardContent = document.querySelector('.card-content');
    const statusSection = document.getElementById('status-section');
    const inputSection = document.getElementById('id-input-section');
    const usernameInput = document.getElementById('roblox-username-input');
    const saveButton = document.getElementById('save-button');
    const formNote = document.getElementById('form-note');
    const completeSection = document.getElementById('complete-section');
    const completeBadge = document.getElementById('complete-badge');
    const completeTitle = document.getElementById('complete-title');

    // .card-content(中身一式)を.card-window(窓)に収まる倍率へ丸ごと等倍縮小する。
    // 「枠だけ縮めると中身が壊れる → 収まらない時だけ全体を等倍縮小する」という
    // roblox-mobile-ui-fitと同じ考え方をWebで行う版。
    // ・offsetWidth/offsetHeight は transform の影響を受けない「素の設計サイズ」を返すため、
    //   現在の縮小率を一旦外さなくても正しく測れる。
    // ・端末の文字サイズ拡大（OS設定）でどれだけ中身が大きくなっても、
    //   高さが窓に収まる倍率まで自動で縮める（横幅は width:100% で窓幅に固定済み）。
    // ・「クリップして読めなくする」よりは「小さくてもいいから全文読める」を優先し、
    //   下限は設けていない（縮小率に理論上の下限はゼロに漸近するが、実際の
    //   端末の文字拡大設定は上限があるため実用上そこまでは縮まない）。
    //   naturalH<=0 のような異常値の場合だけ何もしない安全弁を入れてある。
    function fitCardContent() {
      if (!cardWindow || !cardContent) return;
      // 縮小率を一旦リセットしてから測る（前回scaleの影響を受けないように）
      cardContent.style.transform = 'scale(1)';
      // clientHeightはpadding込みの箱の高さなので、実際に中身が使える高さは
      // そこから上下paddingを引いた分になる
      const winStyle = getComputedStyle(cardWindow);
      const paddingV = parseFloat(winStyle.paddingTop || '0') + parseFloat(winStyle.paddingBottom || '0');
      const availH = cardWindow.clientHeight - paddingV;
      const naturalH = cardContent.scrollHeight;
      if (naturalH <= 0 || availH <= 0) return;
      const scale = Math.min(1, availH / naturalH);
      cardContent.style.transform = 'scale(' + scale + ')';
    }

    // 中身のサイズ変化（文言更新・画面切替・OSの文字サイズ拡大など）を検知して
    // 自動で再フィットする。ResizeObserverが見るのはtransform前のレイアウトサイズなので、
    // fitCardContent自身がtransformを書き換えてもここで無限ループにはならない。
    if (typeof ResizeObserver !== 'undefined' && cardContent && cardWindow) {
      const resizeObserver = new ResizeObserver(function () {
        fitCardContent();
      });
      resizeObserver.observe(cardContent);
      resizeObserver.observe(cardWindow);
    }
    window.addEventListener('resize', fitCardContent);
    window.addEventListener('orientationchange', fitCardContent);

    // URLの ?stampId=XXX からStampIDを取得する
    function getStampIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('stampId');
    }

    // ページ読み込み時のメイン処理
    window.addEventListener('load', function() {
      const stampId = getStampIdFromUrl();
      const username = localStorage.getItem(STORAGE_KEY);

      if (!stampId) {
        displayMessage('エラー: QRコードが無効です。');
        return;
      }

      if (username) {
        displayMessage('ようこそ！\nユーザー名: ' + username + '\nスタンプを記録します...');
        processStamp(username, stampId, 0);
      } else {
        showInputForm();
      }
    });

    // ユーザーが入力したユーザー名でスタンプ処理を開始する
    function saveUsername() {
      const username = usernameInput.value.trim();
      if (username) {
        processStamp(username, getStampIdFromUrl(), 0);
      } else {
        alert('ユーザー名を入力してください。');
      }
    }

    // 指定ミリ秒だけ待つ
    function sleep(ms) {
      return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    // タイムアウト付きfetch。FETCH_TIMEOUT_MSを過ぎても応答が無い通信は
    // AbortControllerで強制的に打ち切る（＝画面が永久に固まることを防ぐ）。
    async function fetchWithTimeout(url, options) {
      const controller = new AbortController();
      const timeoutId = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);
      try {
        return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
      } finally {
        clearTimeout(timeoutId);
      }
    }

    // GAS側のレート制限エラー（「同一ユーザー10秒」）かどうかを判定する。
    // ⚠GAS側の応答にエラー種別コード（例: errorCode: 'RATE_LIMIT'）が無いため、
    //   現状はmessageの文字列一致で判定するしかない。GAS側にエラーコードを
    //   足せば、この文字列一致より堅い判定にできる。
    function isRateLimitMessage(message) {
      return typeof message === 'string' && message.indexOf('早すぎます') !== -1;
    }

    // 「あとX秒で自動的にもう一度お試しします」のカウントダウンを表示しながら待つ
    async function waitWithRetryCountdown(totalSeconds) {
      for (let remaining = totalSeconds; remaining > 0; remaining--) {
        displayMessage('少し待っています…（あと' + remaining + '秒）\n自動でもう一度お試しします');
        await sleep(1000);
      }
    }

    // GASのAPIを呼び出してスタンプを記録する
    // retryCount: レート制限による自動リトライの現在の回数（RATE_LIMIT_MAX_RETRIESで上限）
    async function processStamp(username, stampId, retryCount) {
      retryCount = retryCount || 0;
      showStatus();
      saveButton.disabled = true;
      displayMessage('サーバーと通信しています...');

      let recordResponse = null;
      let recordError = null;
      let isTimeout = false;

      try {
        const res = await fetchWithTimeout(GAS_URL, {
          method: 'POST',
          // Content-Typeをtext/plainにすることで、GASが受け付けられる形式になる
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'recordStamp',
            username: username,
            stampId: stampId
          })
        });

        if (!res.ok) {
          throw new Error('サーバーの応答が異常です (HTTP ' + res.status + ')');
        }

        recordResponse = await res.json();
      } catch (error) {
        recordError = error;
        isTimeout = !!(error && error.name === 'AbortError');
      }

      // 「そろったか」の確認（フォールバック含む）は、記録が成功した時だけ行う。
      // ⚠エラー応答（status !== 'success'）にはcompleteフィールドが無いため、
      //   ここで判定しようとすると「記録が拒否されただけ」なのに完了確認の
      //   フォールバック経路に迷い込んでしまう（今回の不具合の本丸）。
      let handledAsComplete = false;
      if (recordResponse && recordResponse.status === 'success') {
        if (typeof recordResponse.complete === 'boolean') {
          // 「そろったか」はまず記録リクエストの応答自体（recordResponse.complete）を見る。
          // GAS側がrecordStampの応答にもcomplete等を含める設計になっているため、
          // それだけで判定できれば2回目の通信（getStamps）はしない。
          handledAsComplete = maybeShowComplete(recordResponse, username);
        } else {
          // ▼フォールバック▼ 記録は成功したが、GASがまだcomplete系フィールドを
          // 返さない場合だけ、従来通りgetStampsを別途呼んで確認する（通信が1回増える）
          displayMessage('確認しています...');
          try {
            handledAsComplete = await checkCompletionAndMaybeCelebrate(username);
          } catch (error) {
            handledAsComplete = false;
          }
        }
      }

      if (handledAsComplete) {
        localStorage.setItem(STORAGE_KEY, username);
        saveButton.disabled = false;
        return;
      }

      if (recordResponse && recordResponse.status === 'success') {
        displayMessage('✅ ' + recordResponse.message + buildRemainingHint(recordResponse));
        localStorage.setItem(STORAGE_KEY, username);
        saveButton.disabled = false;
        return;
      }

      if (recordResponse && recordResponse.status !== 'success' && isRateLimitMessage(recordResponse.message)) {
        // レート制限は「失敗」ではなく「ちょっと待てば通る」状態なので、
        // 上限回数まで自動でリトライする（無限リトライは禁止）
        if (retryCount < RATE_LIMIT_MAX_RETRIES) {
          await waitWithRetryCountdown(RATE_LIMIT_RETRY_WAIT_SEC);
          return processStamp(username, stampId, retryCount + 1);
        }
        localStorage.removeItem(STORAGE_KEY);
        showInputForm('⚠️ 少し混み合っています。\n少し時間をおいてから、もう一度QRコードを読み取ってください。');
        saveButton.disabled = false;
        return;
      }

      if (recordResponse) {
        // レート制限以外のエラー応答（例: 無効なスタンプID等）。そのままユーザーに見せる。
        localStorage.removeItem(STORAGE_KEY);
        showInputForm('⚠️ ' + recordResponse.message);
        saveButton.disabled = false;
        return;
      }

      if (isTimeout) {
        showInputForm('❌ 通信に時間がかかっています。\n電波の良い場所でもう一度お試しください。');
        saveButton.disabled = false;
        return;
      }

      showInputForm('❌ 通信エラー' + (recordError ? ': ' + recordError.message : '') + '\n電波の良い場所でもう一度お試しください。');
      saveButton.disabled = false;
    }

    // 「あと◯個」のヒントを組み立てる。GASの応答に collected / required が
    // 含まれている場合だけ追加する（ページ内に必要数をハードコードしない）。
    // 含まれていなければ何も追加しない＝これまでの表示のまま。
    function buildRemainingHint(data) {
      if (typeof data.collected !== 'number' || typeof data.required !== 'number') {
        return '';
      }
      const remaining = data.required - data.collected;
      if (remaining <= 0) return '';
      return '\nあと' + remaining + '個！';
    }

    // 「スタンプが全部そろったか」の判定はGAS側の応答に一本化する（data.complete をそのまま使う）。
    // ▼2026-09-04削除▼ 以前はdata.completeが無い場合の保険として、
    // VALID_STAMP_IDS（3個のStampIDを直接ハードコード）とstamps配列を突き合わせて
    // 自前で数えるフォールバックがあったが、GAS側がcompleteに一本化済みであることを
    // 本人が実機で確認できたため削除した。将来スタンプ数を増やした際に、GASが万一
    // completeを返さなくなった場合でも、消えた旧IDのままの自前カウントで
    // 誤ってコンプリート扱いにしてしまう事故を防ぐため。
    // data.completeが無い応答は「完了ではない」として扱う（安全側）。
    function isComplete(data) {
      return typeof data.complete === 'boolean' && data.complete;
    }

    // dataが「コンプリート」を示していればコンプリート画面を表示する。
    // 戻り値: true=コンプリート画面を表示した / false=未コンプリート
    function maybeShowComplete(data, username) {
      if (!isComplete(data)) {
        return false;
      }
      const flagKey = COMPLETE_FLAG_PREFIX + username;
      const alreadyShown = localStorage.getItem(flagKey) === 'true';
      showComplete(!alreadyShown);
      localStorage.setItem(flagKey, 'true');
      return true;
    }

    // フォールバック専用: getStampsを別途呼んでコンプリート判定する
    // （recordStampの応答にcomplete系フィールドが無い、古いGAS向け）
    async function checkCompletionAndMaybeCelebrate(username) {
      const url = GAS_URL + '?action=getStamps&username=' + encodeURIComponent(username);
      const res = await fetchWithTimeout(url);
      if (!res.ok) return false;

      const data = await res.json();
      if (!data || data.status !== 'success') {
        return false;
      }

      return maybeShowComplete(data, username);
    }

    // 入力フォームを表示する（受付画面）
    // noteに文字列を渡すと、フォームの上に赤字のお知らせとして表示する
    function showInputForm(note) {
      card.classList.remove('state-status', 'state-complete');
      card.classList.add('state-input');
      statusSection.classList.add('hidden');
      completeSection.classList.add('hidden');
      inputSection.classList.remove('hidden');

      if (note) {
        formNote.textContent = note;
        formNote.classList.remove('hidden');
      } else {
        formNote.textContent = '';
        formNote.classList.add('hidden');
      }
    }

    // メッセージ画面を表示する（記録しました画面）
    function showStatus() {
      card.classList.remove('state-input', 'state-complete');
      card.classList.add('state-status');
      inputSection.classList.add('hidden');
      completeSection.classList.add('hidden');
      statusSection.classList.remove('hidden');
    }

    // コンプリート画面を表示する
    // isNew: true=たった今全部そろった（お祝い演出） / false=前から全部そろっている（落ち着いた案内）
    function showComplete(isNew) {
      card.classList.remove('state-input', 'state-status');
      card.classList.add('state-complete');
      statusSection.classList.add('hidden');
      inputSection.classList.add('hidden');
      completeSection.classList.remove('hidden');

      if (isNew) {
        completeSection.classList.remove('repeat');
        completeBadge.textContent = '🎉';
        completeTitle.textContent = 'コンプリート達成！';
      } else {
        completeSection.classList.add('repeat');
        completeBadge.textContent = '✅';
        completeTitle.textContent = 'もう全部そろってるよ';
      }
    }

    // 画面にメッセージを表示する
    function displayMessage(message) {
      document.getElementById('status-message').textContent = message;
    }
  </script>
</body>
</html>
